<!doctype html>

<style>

:root{--abyss:#070B2E;--blueberry:#1B2FB8;--aqua:#6FF2FF;--lilac:#C9A6FF;--chrome:#EEF3FF;--peach:#FFB79A}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#070B2E}

.ring{border-radius:50%;border:2px solid rgba(220,240,255,.75);box-shadow:0 0 22px rgba(111,242,255,.55),inset 0 0 22px rgba(111,242,255,.35)}
.rim{border-radius:var(--r);border:1.5px solid rgba(220,235,255,.35)}

<svg width="0" height="0" style="position:absolute"><defs><!--FILTERS--></defs></svg>

<script>
const GK=/*GK*/;
const LAND=/*LAND*/;

const W=1920,H=1080,P=1500;
// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const EZ={
  lin:x=>x,
  io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  out:x=>1-Math.pow(1-x,3),
  o5:x=>1-Math.pow(1-x,5),
  inn:x=>x*x*x,
  ox:x=>x>=1?1:1-Math.pow(2,-10*x),
  ix:x=>x<=0?0:Math.pow(2,10*x-10),
  ob:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
  sine:x=>-(Math.cos(Math.PI*x)-1)/2,
  spr:x=>x>=1?1:1-Math.exp(-6.5*x)*Math.cos(11*x),
};
function kf(t,keys){
  if(t<=keys[0][0])return keys[0][1];
  for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const[t0,v0]=keys[i-1],[t1,v1,e]=keys[i];return v0+(v1-v0)*(EZ[e||'io'])((t-t0)/(t1-t0));}}
  return keys[keys.length-1][1];
}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const $=(tag,cls,parent,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e};

function cam(world,c){world.style.transform=`translateZ(${c.z.toFixed(2)}px) rotateZ(${c.rz.toFixed(3)}deg) rotateX(${c.rx.toFixed(3)}deg) rotateY(${c.ry.toFixed(3)}deg) translate3d(${(-(c.x||0)).toFixed(2)}px,${(-(c.y||0)).toFixed(2)}px,0)`}
const D=Math.PI/180;
function project(c,x,y,z){ // mirror of cam() for canvas overlays
  x-=c.x||0;y-=c.y||0;

// ---------- scene scaffolding ----------
const FRAME=document.getElementById('frame');
function makeStage(id,base,blobs){
  const st=$('div','stage',FRAME);st.id=id;const bg=$('div','bg',st);

  const world=$('div','world',st);return{st,bg,blobs:bl,world};
}
function moveBlobs(S,u,paths){S.blobs.forEach((b,i)=>{const[p,q,r,s]=paths[i];const sz=parseFloat(b.style.width);b.style.transform=`translate(${(p+Math.sin(u*q+i)*r-sz/2).toFixed(1)}px,${(s+Math.cos(u*q*.8+i*2)*r*.6-sz/2).toFixed(1)}px)`})}

function letters(parent,text,cls,size){

const SPR=document.createElement('canvas');SPR.width=SPR.height=128;{const g=SPR.getContext('2d');const c=64;

function sparkles(list,c,t,amt=1){if(!c)return;list.forEach(s=>{const p=project(c,s.x,s.y,s.z);if(!p)return;const tw=Math.pow(Math.max(0,Math.sin(t*2.6+s.p*3)),3);if(tw<.02)return;const sz=34*s.s*p.k*(.5+tw);

  GO.style.opacity=(gin).toFixed(3);GO.style.transform=`scale(${(lerp(.82,1.04,EZ.out(gp))+gout*1.4).toFixed(4)})`;GO.style.letterSpacing=`${lerp(18,-4,EZ.o5(gin)).toFixed(1)}px`;
  document.getElementById('goT').style.setProperty('--sx',kf(t,[[10.5,-40],[11.6,160]])+'%');
  const tg=EZ.o5(seg(t,13.65,14.15));TAG.style.display=t>13.6?'block':'none';TAG.style.opacity=tg.toFixed(3);TAG.style.transform=`translateY(${((1-tg)*30).toFixed(1)}px)`;TAG.style.filter=`blur(${((1-tg)*6).toFixed(1)}px)`;
  const cp=seg(t,13.95,14.55);CTA.style.display=t>13.9?'block':'none';CTA.style.opacity=clamp(cp*3).toFixed(3);CTA.style.left=(W/2-GK.cta.w/2)+'px';CTA.style.top=(860-GK.cta.h/2)+'px';
  CTA.style.transform=`scale(${(0.6+0.4*EZ.spr(cp)).toFixed(4)})`;CTA.style.setProperty('--a',(t*80)+'deg');CTA.style.setProperty('--sh',kf(t,[[14.3,-100],[14.95,60]])+'%');
  WIPE.style.setProperty('--a',(t*200)+'deg');
  // fx
  fx.clearRect(0,0,W,H);
  if(v1){sparkles(S1.spk,S1.cam,t,EZ.out(seg(t,.2,1)));if(S1.cam){const p=project(S1.cam,-120,-200,120);if(p)flare(p.x,p.y,.7+.2*Math.sin(t*3),EZ.out(seg(t,.9,1.4))*.75)}}

  GRAIN.style.transform=`translate(${Math.round((Math.sin(t*97)*.5+.5)*64-32)}px,${Math.round((Math.cos(t*71)*.5+.5)*64-32)}px)`;
