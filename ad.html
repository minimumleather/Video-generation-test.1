:root{--abyss:#070B2E;--blueberry:#1B2FB8;--aqua:#6FF2FF;--lilac:#C9A6FF;--chrome:#EEF3FF;--peach:#FFB79A}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#070B2E}
body{font-family:'Onest',system-ui,sans-serif;color:#EEF3FF;-webkit-font-smoothing:antialiased}
#frame{position:absolute;inset:0;overflow:hidden}
.stage{position:absolute;inset:0;perspective:1500px;overflow:hidden;display:none}
.bg{position:absolute;inset:0;overflow:hidden}
.bg canvas{position:absolute;inset:0}
.blob{position:absolute;border-radius:50%;mix-blend-mode:screen;left:0;top:0}
.world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.n{position:absolute;left:0;top:0}
.grp{transform-style:preserve-3d}
.unb{font-family:'Unbounded',sans-serif}
.hud{font-family:'Chakra Petch',sans-serif}
.glass{border-radius:var(--r,40px);overflow:hidden;
  background:linear-gradient(155deg,rgba(255,255,255,.20),rgba(255,255,255,.05) 38%,rgba(150,170,255,.07) 70%,rgba(255,255,255,.13));
  box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.7),inset -1px -1px 0 rgba(255,255,255,.28),inset 0 0 30px rgba(255,255,255,.08),0 40px 80px -24px rgba(3,6,40,.55)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.6px;z-index:5;
  background:conic-gradient(from var(--a,0deg),rgba(255,255,255,.95),rgba(111,242,255,.75),rgba(201,166,255,.8),rgba(255,183,154,.65),rgba(255,255,255,.95),rgba(111,242,255,.6),rgba(255,255,255,.95));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass::after{content:"";position:absolute;left:-30%;top:-30%;width:160%;height:160%;z-index:4;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.26) 48.5%,rgba(255,255,255,.06) 52%,transparent 58%);
  transform:translateX(var(--sh,-100%))}
.tint{background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(40,50,140,.18) 45%,rgba(20,24,90,.22))}
.chrome{background:linear-gradient(100deg,transparent calc(var(--sx,-200%) - 18%),rgba(255,255,255,.95) var(--sx,-200%),transparent calc(var(--sx,-200%) + 18%)),
  linear-gradient(180deg,#ffffff 0%,#e6edff 28%,#9aa6e0 46%,#2a3790 51%,#7d8ad0 57%,#dfe6ff 74%,#ffffff 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.iri{background:linear-gradient(90deg,#6FF2FF,#C9A6FF 45%,#FFB79A 80%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.bubble{border-radius:50%;
  background:radial-gradient(circle at 32% 27%,rgba(255,255,255,.95) 0 5%,rgba(255,255,255,.3) 11%,transparent 30%),
  radial-gradient(circle at 68% 76%,rgba(111,242,255,.45),transparent 40%),
  radial-gradient(circle,rgba(201,166,255,.06) 52%,rgba(150,140,255,.35) 66%,rgba(255,255,255,.8) 70.5%,transparent 71.5%)}
.ring{border-radius:50%;border:2px solid rgba(220,240,255,.75);box-shadow:0 0 22px rgba(111,242,255,.55),inset 0 0 22px rgba(111,242,255,.35)}
.rim{border-radius:var(--r);border:1.5px solid rgba(220,235,255,.35)}
.floor{background-image:linear-gradient(rgba(111,242,255,.55) 2px,transparent 2px),linear-gradient(90deg,rgba(111,242,255,.55) 2px,transparent 2px);
  background-size:140px 140px;-webkit-mask:radial-gradient(closest-side,#000 15%,rgba(0,0,0,.4) 55%,transparent 100%)}
/* phone ui */
.sb{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:18px;padding:0 10px;letter-spacing:.2px}
.sbr{display:flex;gap:7px;align-items:center}
.sig{width:20px;height:12px;background:linear-gradient(90deg,#fff 0 3px,transparent 3px 5.5px,#fff 5.5px 8.5px,transparent 8.5px 11px,#fff 11px 14px,transparent 14px 16.5px,#fff 16.5px);clip-path:polygon(0 75%,25% 75%,25% 50%,50% 50%,50% 25%,75% 25%,75% 0,100% 0,100% 100%,0 100%)}
.bat{width:27px;height:13px;border:1.6px solid rgba(255,255,255,.8);border-radius:4px;padding:1.5px}
.bat::after{content:"";display:block;width:75%;height:100%;background:#fff;border-radius:1.5px}
.row{display:flex;align-items:center;gap:14px;padding:0 18px;height:100%;position:relative;z-index:2}
.tile{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,rgba(111,242,255,.9),rgba(140,120,255,.85));box-shadow:inset 1px 1px 0 rgba(255,255,255,.7)}
.tile svg{width:24px;height:24px}
.rt{flex:1;min-width:0}.rt b{display:block;font-weight:600;font-size:19px}.rt span{font-size:15px;opacity:.72}
.rv{font-weight:600;font-size:19px}
.cap{position:absolute;left:120px;bottom:104px;font-weight:600;font-size:50px;letter-spacing:-.5px;white-space:nowrap;
  text-shadow:0 2px 30px rgba(20,30,120,.6)}
.cap .w{display:inline-block;margin-right:.26em}
.capline{position:absolute;left:120px;bottom:178px;height:2px;width:220px;background:linear-gradient(90deg,#6FF2FF,#C9A6FF,transparent);transform-origin:0 50%}
.capk{position:absolute;left:120px;bottom:190px;font-size:20px;letter-spacing:1px;color:#bfefff}
#ui{position:absolute;inset:0}
#fx{position:absolute;inset:0;mix-blend-mode:screen}

  for(const[lat,lon]of LAND){const p=orth(lat,lon,o);if(p.z>0){g.fillStyle=`rgba(${Math.round(150+p.z*105)},${Math.round(235+p.z*20)},255,${(.35+p.z*.65).toFixed(3)})`;const s=o.dot*(.6+p.z*.5);g.fillRect(p.x-s/2,p.y-s/2,s,s)}else{g.fillStyle='rgba(150,180,255,.09)';g.fillRect(o.c*2-p.x-1,p.y-1,1.6,1.6)}}
  g.strokeStyle='rgba(200,245,255,.8)';g.lineWidth=2;g.beginPath();g.arc(o.c,o.c,o.R,0,7);g.stroke();
  if(o.arc!=null){
    const A=v3(...SFO),B=v3(...KIX),N=120,pts=[];for(let i=0;i<=N;i++){const t=i/N;const[la,lo]=ll(slerp(A,B,t));pts.push(orth(la,lo,o,.16*Math.sin(Math.PI*t)))}
    const end=Math.floor(o.arc*N);g.lineCap='round';
    g.setLineDash([3,7]);g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=2;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke();g.setLineDash([]);
    for(const[w,a]of[[14,.12],[6,.35],[2.6,1]]){g.lineWidth=w;g.beginPath();for(let i=0;i<=end;i++){const p=pts[i];i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)}
      const lg=g.createLinearGradient(pts[0].x,pts[0].y,pts[N].x,pts[N].y);lg.addColorStop(0,`rgba(111,242,255,${a})`);lg.addColorStop(.6,`rgba(201,166,255,${a})`);lg.addColorStop(1,`rgba(255,183,154,${a})`);g.strokeStyle=lg;g.stroke()}
    const hp=pts[end],hq=pts[Math.max(0,end-2)];const hg=g.createRadialGradient(hp.x,hp.y,0,hp.x,hp.y,30);hg.addColorStop(0,'rgba(255,255,255,1)');hg.addColorStop(.3,'rgba(111,242,255,.6)');hg.addColorStop(1,'rgba(111,242,255,0)');g.fillStyle=hg;g.beginPath();g.arc(hp.x,hp.y,30,0,7);g.fill();
    g.save();g.translate(hp.x,hp.y);g.rotate(Math.atan2(hp.y-hq.y,hp.x-hq.x));g.fillStyle='#fff';g.beginPath();g.moveTo(12,0);g.lineTo(-8,-8);g.lineTo(-4,0);g.lineTo(-8,8);g.closePath();g.fill();g.restore();
    for(const[cpos,name,t0]of[[SFO,'SFO',0],[KIX,'KIX',.92]]){const p=orth(cpos[0],cpos[1],o);if(p.z<=0)continue;const pulse=(performanceT*1.2+t0)%1;
      g.strokeStyle=`rgba(111,242,255,${1-pulse})`;g.lineWidth=2;g.beginPath();g.arc(p.x,p.y,6+pulse*26,0,7);g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(p.x,p.y,5,0,7);g.fill();
      if(o.labels&&(name==='SFO'||o.arc>.85)){g.font='600 24px "Chakra Petch"';g.fillStyle=`rgba(255,255,255,${name==='KIX'?clamp((o.arc-.85)*8):1})`;g.fillText(name,p.x+14,p.y-12);g.font='500 15px "Chakra Petch"';g.fillStyle='rgba(180,240,255,.85)';g.fillText(`${Math.abs(cpos[0]).toFixed(2)}° N  ${Math.abs(cpos[1]).toFixed(2)}° ${cpos[1]<0?'W':'E'}`,p.x+14,p.y+8)}}
  }
  if(o.glow){const hg=g.createRadialGradient(o.c,o.c,o.R*.9,o.c,o.c,o.R*1.25);hg.addColorStop(0,'rgba(111,242,255,.35)');hg.addColorStop(1,'rgba(111,242,255,0)');g.fillStyle=hg;g.beginPath();g.arc(o.c,o.c,o.R*1.25,0,7);g.arc(o.c,o.c,o.R,0,7,true);g.fill()}
}
// =========================== overlay layers ===========================
const UI=$('div','',FRAME);UI.id='ui';
const FX=$('canvas','',FRAME);FX.id='fx';FX.width=W;FX.height=H;const fx=FX.getContext('2d');
function capEl(text,kicker){const box=$('div','',UI);const k=$('div','capk hud',box,kicker);const l=$('div','capline',box);const c=$('div','cap',box,text.split(' ').map(w=>`<span class="w">${w}</span>`).join(''));return{box,k,l,ws:[...c.querySelectorAll('.w')]}}
const CAP2=capEl('One search plans the whole trip.','Trip builder'),CAP3=capEl('Every flight, tracked live.','Live tracking');
function capR(C,t,a,b){const vis=t>a-.05&&t<b+.05;C.box.style.display=vis?'block':'none';if(!vis)return;const out=EZ.io(seg(t,b-.35,b));
  C.ws.forEach((w,i)=>{const p=EZ.o5(seg(t,a+i*.07,a+.5+i*.07));w.style.opacity=(p*(1-out)).toFixed(3);w.style.transform=`translateY(${((1-p)*40-out*20).toFixed(1)}px)`;w.style.filter=`blur(${((1-p)*8).toFixed(1)}px)`});
  const lp=EZ.ox(seg(t,a,a+.6));C.l.style.transform=`scaleX(${(lp*(1-out)).toFixed(3)})`;C.k.style.opacity=(EZ.out(seg(t,a+.1,a+.5))*(1-out)).toFixed(3)}
const GO=$('div','unb',UI);GO.style.cssText='position:absolute;left:0;right:0;top:50%;text-align:center;font-size:170px;font-weight:800;letter-spacing:-4px;white-space:nowrap;margin-top:-120px;filter:drop-shadow(0 10px 40px rgba(20,30,140,.7))';
GO.innerHTML='<span class="chrome" id="goT">Go anywhere.</span>';
const TAG=$('div','',UI);TAG.style.cssText='position:absolute;left:0;right:0;top:722px;text-align:center;font-size:44px;font-weight:500;letter-spacing:-.3px';TAG.innerHTML='<span>Your whole trip, crystal clear.</span>';
const CTA=glass(UI,'cta',`<div class="row" style="justify-content:center;gap:12px;font-size:28px;font-weight:600"><span style="width:26px;height:26px;display:block">${ICON.spark}</span>Get the app</div>`);CTA.style.position='absolute';
const WIPE=glass(UI,'wipe','<div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.18) 50%,rgba(255,255,255,.05))"></div>');WIPE.style.position='absolute';
const FLASH=$('div','',FRAME);FLASH.id='flash';
const GRAIN=$('div','',FRAME);GRAIN.id='grain';GRAIN.style.backgroundImage=`url(${NOISE})`;
const VIG=$('div','',FRAME);VIG.id='vig';
// sparkle sprite
const SPR=document.createElement('canvas');SPR.width=SPR.height=128;{const g=SPR.getContext('2d');const c=64;
  const rg=g.createRadialGradient(c,c,0,c,c,22);rg.addColorStop(0,'rgba(255,255,255,1)');rg.addColorStop(.25,'rgba(200,250,255,.7)');rg.addColorStop(1,'rgba(111,242,255,0)');g.fillStyle=rg;g.fillRect(0,0,128,128);
  for(const[w,h]of[[64,3],[3,64]]){const lg=g.createRadialGradient(c,c,0,c,c,64);lg.addColorStop(0,'rgba(255,255,255,1)');lg.addColorStop(.5,'rgba(190,240,255,.45)');lg.addColorStop(1,'rgba(160,200,255,0)');g.fillStyle=lg;g.beginPath();g.ellipse(c,c,w,h,0,0,7);g.fill()}}
function sparkles(list,c,t,amt=1){if(!c)return;list.forEach(s=>{const p=project(c,s.x,s.y,s.z);if(!p)return;const tw=Math.pow(Math.max(0,Math.sin(t*2.6+s.p*3)),3);if(tw<.02)return;const sz=34*s.s*p.k*(.5+tw);
  fx.globalAlpha=clamp(tw*amt);fx.drawImage(SPR,p.x-sz,p.y-sz,sz*2,sz*2)});fx.globalAlpha=1}
function flare(x,y,s,a){fx.globalAlpha=clamp(a);fx.drawImage(SPR,x-130*s,y-130*s,260*s,260*s);const lg=fx.createLinearGradient(x-700*s,0,x+700*s,0);lg.addColorStop(0,'rgba(111,242,255,0)');lg.addColorStop(.5,'rgba(220,250,255,.9)');lg.addColorStop(1,'rgba(201,166,255,0)');
  fx.fillStyle=lg;fx.fillRect(x-700*s,y-2.5*s,1400*s,5*s);fx.globalAlpha=1}
let performanceT=0;
// =========================== master render ===========================
function render(t){
  performanceT=t;
  const v1=t<2.5,v2=t>=2.5&&t<6.62,v3=t>=6.08&&t<10,v4=t>=10&&t<12.5,v5=t>=12.5;
  show(S1.st,v1);show(S2.st,v2);show(S3.st,v3);show(S4.st,v4);show(S5.st,v5);
  if(v1)R1(t);if(v2)R2(t-2.5);if(v3)R3(t-6.12);if(v4)R4(t-10);if(v5)R5(t-12.5);
  // liquid glass wipe s2 -> s3
  const wp=EZ.io(seg(t,6.1,6.62));const X=lerp(-420,W+420,wp);const wipeOn=t>6.08&&t<6.64;

  if(wipeOn){WIPE.style.transform=`translate(${(X).toFixed(1)}px,${H/2}px) rotate(9deg)`;S2.st.style.clipPath=`inset(0 0 0 ${clamp(X,0,W).toFixed(1)}px)`;S3.st.style.clipPath=`inset(0 ${(W-clamp(X,0,W)).toFixed(1)}px 0 0)`}
  else{S2.st.style.clipPath='none';S3.st.style.clipPath='none'}
  // flashes
  const fl=Math.max(Math.exp(-Math.pow((t-2.5)/.085,2)),Math.exp(-Math.pow((t-10)/.07,2))*.95,Math.exp(-Math.pow((t-12.5)/.09,2)));FLASH.style.opacity=fl.toFixed(3);
  // captions
  capR(CAP2,t,3.55,6.15);capR(CAP3,t,7.05,9.75);
  const gp=seg(t,10.15,12.45),gin=EZ.o5(seg(t,10.12,10.75)),gout=EZ.inn(seg(t,12.2,12.5));GO.style.display=(t>10.1&&t<12.5)?'block':'none';
  GO.style.opacity=(gin).toFixed(3);GO.style.transform=`scale(${(lerp(.82,1.04,EZ.out(gp))+gout*1.4).toFixed(4)})`;GO.style.letterSpacing=`${lerp(18,-4,EZ.o5(gin)).toFixed(1)}px`;
  document.getElementById('goT').style.setProperty('--sx',kf(t,[[10.5,-40],[11.6,160]])+'%');
  const tg=EZ.o5(seg(t,13.65,14.15));TAG.style.display=t>13.6?'block':'none';TAG.style.opacity=tg.toFixed(3);TAG.style.transform=`translateY(${((1-tg)*30).toFixed(1)}px)`;TAG.style.filter=`blur(${((1-tg)*6).toFixed(1)}px)`;
  const cp=seg(t,13.95,14.55);CTA.style.display=t>13.9?'block':'none';CTA.style.opacity=clamp(cp*3).toFixed(3);CTA.style.left=(W/2-GK.cta.w/2)+'px';CTA.style.top=(860-GK.cta.h/2)+'px';
  CTA.style.transform=`scale(${(0.6+0.4*EZ.spr(cp)).toFixed(4)})`;CTA.style.setProperty('--a',(t*80)+'deg');CTA.style.setProperty('--sh',kf(t,[[14.3,-100],[14.95,60]])+'%');
  WIPE.style.setProperty('--a',(t*200)+'deg');
  // fx
  fx.clearRect(0,0,W,H);
  if(v1){sparkles(S1.spk,S1.cam,t,EZ.out(seg(t,.2,1)));if(S1.cam){const p=project(S1.cam,-120,-200,120);if(p)flare(p.x,p.y,.7+.2*Math.sin(t*3),EZ.out(seg(t,.9,1.4))*.75)}}
  if(v2)sparkles(S2.spk,S2.cam,t,.9);
  if(v3)sparkles(S3.spk,S3.cam,t,.8);
  if(v4)sparkles(S4.spk,S4.cam,t,.7);
  if(v5){sparkles(S5.spk,S5.cam,t,EZ.out(seg(t,12.6,13.2)));const p=project(S5.cam,92,-300,40);if(p){const a=Math.exp(-Math.pow((t-13.55)/.22,2));flare(p.x,p.y,.9+a*.6,a+.25*EZ.out(seg(t,13.4,14))*(.6+.4*Math.sin(t*4)))}}
  GRAIN.style.transform=`translate(${Math.round((Math.sin(t*97)*.5+.5)*64-32)}px,${Math.round((Math.cos(t*71)*.5+.5)*64-32)}px)`;
}
